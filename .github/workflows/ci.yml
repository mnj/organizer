name: ci

# Spec #21: raw executable + AppImage distribution with CI smoke.
# Raw binary + AppImage only — flatpak/flatpak-github-actions is NOT used.
on:
  push:
    branches: ["main", "research/*", "prototype/*"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Headless filesystem acceptance (Queue + Config + Dedup + Mover + Undo
  # seam on tempdir, no display) + raw release binary artifact.
  raw:
    name: raw (test + release binary)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install sys-deps (apt one-liner, see docs/packaging.md)
        run: |
          sudo apt update
          sudo apt install -y libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            liblcms2-dev libfontconfig1-dev libseccomp-dev bubblewrap \
            pkg-config build-essential curl xvfb \
            desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Typecheck
        run: cargo check --locked --all-targets

      - name: Headless tempdir acceptance
        run: cargo test --locked -- --nocapture

      - name: Raw release binary
        run: |
          cargo build --release --locked
          strip target/release/organizer
          ./target/release/organizer --version
          ./target/release/organizer --self-test-sandbox | tee /tmp/self-test.log
          grep -q "bwrap" /tmp/self-test.log

      - name: xvfb Preview smoke
        run: |
          xvfb-run -a ./target/release/organizer --help
          xvfb-run -a ./target/release/organizer --self-test-sandbox | tee /tmp/xvfb-smoke.log
          grep -q "gtk4paintablesink" /tmp/xvfb-smoke.log

      # Canonical raw tarball recipe (kept identical in docs/packaging.md):
      # binary + README.md, checksummed.
      - name: Package raw tarball
        run: |
          cp README.md target/release/
          tar czf organizer-x86_64-linux-gnu.tar.gz -C target/release organizer README.md
          sha256sum organizer-x86_64-linux-gnu.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: organizer-raw
          path: |
            organizer-x86_64-linux-gnu.tar.gz
            SHA256SUMS
            target/release/organizer

  # Spec acceptance: `cargo build --release --locked` succeeds on
  # ubuntu:22.04/fedora/arch. ubuntu is covered by `raw`/`appimage` above;
  # this matrix proves the per-distro sys-deps one-liners (docs/packaging.md).
  distro-matrix:
    name: raw build (${{ matrix.id }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - id: fedora-41
            image: fedora:41
          - id: arch
            image: archlinux/archlinux:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sys-deps (fedora one-liner, see docs/packaging.md)
        if: matrix.id == 'fedora-41'
        run: |
          dnf install -y gtk4-devel libadwaita-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-good \
            gstreamer1-plugins-bad-free gstreamer1-plugin-libav \
            gstreamer1-plugins-good-extras liblcms2-devel fontconfig-devel \
            libseccomp-devel bubblewrap pkgconf-pkg-config gcc \
            meson ninja-build git curl tar gzip findutils procps-ng

      - name: Install sys-deps (arch one-liner, see docs/packaging.md)
        if: matrix.id == 'arch'
        run: |
          pacman -Syu --noconfirm --needed gtk4 libadwaita gstreamer gst-plugins-base \
            gst-plugins-good gst-plugins-bad gst-libav lcms2 fontconfig libseccomp \
            bubblewrap pkgconf base-devel meson ninja git curl tar gzip

      - name: Build glycin-loaders from source (no distro package)
        run: |
          git clone --depth 1 https://gitlab.gnome.org/GNOME/glycin.git /tmp/glycin
          meson setup /tmp/glycin/builddir /tmp/glycin -Dglycin-loaders=true -Dprefix=/usr
          meson compile -C /tmp/glycin/builddir
          meson install -C /tmp/glycin/builddir

      - uses: dtolnay/rust-toolchain@stable

      - name: Raw release binary + headless probe
        # Headless-safe equivalent of `organizer /tmp/src` (GUI launch is
        # proven by the xvfb smoke in `raw`/`appimage` on ubuntu).
        run: |
          cargo build --release --locked
          ./target/release/organizer --version
          ./target/release/organizer --self-test-sandbox | tee /tmp/self-test.log
          grep -q "bwrap" /tmp/self-test.log

  # AppImage on ubuntu:22.04 (glibc 2.35 baseline) + smoke in a dep-stripped
  # ubuntu:22.04 container (no host gtk/gstreamer/glycin) proving bundling.
  appimage:
    name: appimage (linuxdeploy + appimagetool + smoke)
    runs-on: ubuntu-22.04
    needs: raw
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            liblcms2-dev libfontconfig1-dev libseccomp-dev bubblewrap \
            fuse libfuse2 pkg-config meson ninja-build python3-pip cmake gettext \
            desktop-file-utils appstream librsvg2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # No cargo-c package on jammy — build it (cached by rust-cache).
      - name: Install cargo-c
        run: cargo install cargo-c --locked

      - name: Build glycin-loaders from source (jammy has no package)
        # Jammy ships meson 0.61 (need >=1.2) and cairo 1.16 (svg needs
        # >=1.17): pip meson + source cairo. Loaders trimmed to what jammy
        # can build (image-rs + svg; heif/jxl need libheif/libjxl).
        run: |
          pip3 install -U meson tomli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sL -o /tmp/cairo.tar.xz https://cairographics.org/releases/cairo-1.18.4.tar.xz
          tar xf /tmp/cairo.tar.xz -C /tmp
          meson setup /tmp/cairo-1.18.4/builddir /tmp/cairo-1.18.4 -Dprefix=/usr -Dtests=disabled
          sudo meson compile -C /tmp/cairo-1.18.4/builddir
          sudo meson install -C /tmp/cairo-1.18.4/builddir
          git clone --depth 1 https://gitlab.gnome.org/GNOME/glycin.git /tmp/glycin
          meson setup /tmp/glycin/builddir /tmp/glycin -Dglycin-loaders=true \
            -Dloaders=glycin-image-rs,glycin-svg \
            -Dlibglycin=false -Dlibglycin-gtk4=false -Dglycin-thumbnailer=false \
            -Dintrospection=false -Dprefix=/usr -Dtests=false
          meson compile -C /tmp/glycin/builddir
          sudo meson install -C /tmp/glycin/builddir

      - name: Fetch linuxdeploy + appimagetool
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy appimagetool
          ./linuxdeploy --version || true

      - name: Build AppImage
        run: |
          ./packaging/build-appimage.sh Organizer.AppDir Organizer-x86_64.AppImage
          ls -lh Organizer-x86_64.AppImage Organizer-x86_64.AppImage.zsync

      - name: Smoke test (host)
        run: |
          ./Organizer-x86_64.AppImage --self-test-sandbox | tee /tmp/appimage-smoke.log
          grep -q "bwrap" /tmp/appimage-smoke.log
          grep -q "gtk4paintablesink" /tmp/appimage-smoke.log

      - name: Smoke test (dep-stripped ubuntu:22.04 — no gtk/gstreamer/glycin)
        # No FUSE in docker, so extract and run the AppRun hook directly
        # (same path as packaging/smoke.sh for *.AppImage).
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 bash -c "
            set -eu
            apt update -qq && apt install -y --no-install-recommends libglib2.0-0 ca-certificates xvfb 2>&1 | tail -n 5
            ./Organizer-x86_64.AppImage --appimage-extract >/dev/null
            ./squashfs-root/AppRun --self-test-sandbox 2>&1 | tee /tmp/dep-stripped.log
            grep -q bwrap /tmp/dep-stripped.log && echo 'bundled bwrap ok'
            grep -q gtk4paintablesink /tmp/dep-stripped.log && echo 'bundled sink probe ok'
            xvfb-run -a ./squashfs-root/AppRun --self-test-sandbox 2>&1 | tee /tmp/dep-stripped-xvfb.log
            grep -q bwrap /tmp/dep-stripped-xvfb.log
          "

      - name: Verify zsync sidecar + embedded update string
        run: |
          head -c 200 Organizer-x86_64.AppImage.zsync | grep -q "zsync" \
            || { echo "ERROR: .zsync sidecar is not a zsync file"; exit 1; }
          strings Organizer-x86_64.AppImage | grep -q "gh-releases-zsync" \
            || { echo "ERROR: update string not embedded in AppImage (AppImageUpdate deltas need it)"; exit 1; }
          echo "zsync + update string ok (AppImageUpdate can delta-update)"

      - name: Triage jpg+webm fixtures via bundled plugins (xvfb)
        # Encodes real fixtures, then launches the AppImage ON the fixture
        # Source Folder under Xvfb and requires it to stay up: proves the
        # bundled glycin/GStreamer plugins decode jpg+webm with no host libs.
        run: |
          mkdir -p /tmp/smoke-src
          gst-launch-1.0 videotestsrc num-buffers=1 ! video/x-raw,width=64,height=64 ! jpegenc ! filesink location=/tmp/smoke-src/a.jpg
          gst-launch-1.0 videotestsrc num-buffers=15 ! video/x-raw,width=64,height=64,framerate=10/1 ! vp8enc ! webmmux ! filesink location=/tmp/smoke-src/b.webm
          ls -l /tmp/smoke-src/
          timeout -s KILL 30 xvfb-run -a ./Organizer-x86_64.AppImage /tmp/smoke-src >/tmp/triage-run.log 2>&1 &
          APP_PID=$!
          sleep 15
          kill -0 $APP_PID && echo "AppImage triaging jpg+webm (alive after 15s under Xvfb)"
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          grep -qi "error\|critical\|cannot" /tmp/triage-run.log && { echo "ERROR: triage run logged failures:"; cat /tmp/triage-run.log; exit 1; } || true

      - uses: actions/upload-artifact@v4
        with:
          name: Organizer-x86_64.AppImage
          path: |
            Organizer-x86_64.AppImage
            Organizer-x86_64.AppImage.zsync

  release:
    name: release (attach artifacts on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: [raw, appimage]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/organizer-raw/organizer-x86_64-linux-gnu.tar.gz
            dist/organizer-raw/SHA256SUMS
            dist/Organizer-x86_64.AppImage/Organizer-x86_64.AppImage
            dist/Organizer-x86_64.AppImage/Organizer-x86_64.AppImage.zsync
          generate_release_notes: true
