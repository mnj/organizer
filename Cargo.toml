[package]
name = "organizer"
version = "0.1.0"
edition = "2021"
description = "File-triaging desktop app — maximized GTK4 split-view with sandboxed preview"

[[bin]]
name = "organizer"
path = "src/main.rs"

[lib]
name = "organizer_lib"
path = "src/lib.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
glib = "0.22"
gdk4 = "0.11"
gio = "0.22"
glycin = { version = "4.0.0-beta.1", features = ["gdk4"] }
gstreamer = "0.25"
clap = { version = "4.5", features = ["derive"] }
natord = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
fs2 = "0.4"
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
