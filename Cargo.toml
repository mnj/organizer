[package]
name = "organizer"
version = "0.1.0"
edition = "2021"
description = "File-triaging desktop app — maximized GTK4 split-view with sandboxed preview"

[[bin]]
name = "organizer"
path = "src/main.rs"

[lib]
name = "organizer_lib"
path = "src/lib.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
gdk4 = "0.9"
gio = "0.20"
clap = { version = "4.5", features = ["derive"] }
natord = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
fs2 = "0.4"
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
